name: Gerar animações do perfil

on:
  schedule:
    - cron: "0 3 * * *" # todo dia às 00h (Brasília)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cobrinha percorrendo o gráfico de contribuições
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#0f766e
            dist/snake-dark.svg?color_snake=#f97316&color_dots=#161616,#3a3a3a,#6b6b6b,#a3a3a3,#fafafa

      # Gráfico de contribuições em 3D (animado)
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d/settings.json

      - name: Juntar arquivos gerados
        run: mkdir out && cp dist/*.svg profile-3d-contrib/*.svg out/

      # Publica tudo na branch "output" (não suja o histórico da main)
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
