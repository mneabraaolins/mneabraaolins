name: Gerar animações do perfil

on:
  schedule:
    - cron: "0 3 * * *" # todo dia às 00h (Brasília)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Cobrinha percorrendo o gráfico de contribuições
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#0f766e
            dist/snake-dark.svg?palette=github-dark&color_snake=#fbbf24

      # Gráfico de contribuições em 3D (animado)
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Juntar arquivos gerados
        run: cp profile-3d-contrib/*.svg dist/

      # Publica tudo na branch "output" (não suja o histórico da main)
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
