  <style>
    text { font-family: ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .st { fill: #fff; opacity: .5; animation: tw 3s ease-in-out infinite alternate; }
    @keyframes tw { from { opacity: .12; } to { opacity: .95; } }
    .sp { fill: #fff; opacity: .7; transform-box: fill-box; transform-origin: center; animation: spk 4s ease-in-out infinite; }
    @keyframes spk { 0%, 100% { transform: scale(.25) rotate(0deg); opacity: .15; } 50% { transform: scale(1) rotate(45deg); opacity: 1; } }
    .glint { animation: glint 4s ease-in-out infinite; }
    @keyframes glint { 0% { transform: translateX(0); opacity: 0; } 10% { opacity: 1; } 55% { transform: translateX(556px); opacity: 0; } 100% { transform: translateX(556px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .glint { display: none; } }
  </style>
